# ==============================================================================
# Sol Home Server — Declarative Glance Command Center (v0.8+)
# ==============================================================================
# Host: Apple MacBook Pro (14-inch, 2021) • Apple M1 Pro (8C / 16GB RAM)
# Storage: 500GB Internal NVMe + 22TB WD Elements (PANOPTICON)
# Ingress: https://dash.vrg.rocks & https://sol.vrg.rocks (-> /sol)
# ==============================================================================

server:
  assets-path: /app/assets

branding:
  logo-url: /assets/sol.svg
  favicon-url: /assets/sol.svg
  app-name: "Sol // Command Center"
  app-icon-url: /assets/sol.svg
  custom-footer: '<p class="size-h6 color-subdue">Sol Home Server • Apple M1 Pro (8C / 16GB) + 22TB PANOPTICON • Therapist for Thinking Sand</p>'

theme:
  custom-css-file: /assets/user.css
  default-preset: sol-catppuccin-mocha
  presets:
    sol-catppuccin-mocha:
      background-color: 240 21 15
      contrast-multiplier: 1.2
      primary-color: 267 84 81
      positive-color: 115 54 76
      negative-color: 347 87 68
    sol-gm3-obsidian:
      background-color: 220 20 8
      contrast-multiplier: 1.25
      primary-color: 215 90 75
      positive-color: 142 65 65
      negative-color: 355 85 68
    sol-imax-amber:
      background-color: 225 18 9
      contrast-multiplier: 1.25
      primary-color: 38 95 65
      positive-color: 145 63 62
      negative-color: 354 84 66
    sol-cockpit-ecam:
      background-color: 210 25 9
      contrast-multiplier: 1.25
      primary-color: 188 86 64
      positive-color: 135 68 62
      negative-color: 36 95 62

pages:
  # ============================================================================
  # PAGE 1: SOL — INFRASTRUCTURE & OPERATIONS DECK (/sol)
  # ============================================================================
  # Note: First page in `pages:` serves `/` and `slug: sol` matches Caddy's
  # `sol.vrg.rocks -> https://dash.vrg.rocks/sol` 302 redirect.
  - name: Sol
    slug: sol
    width: wide
    show-mobile-header: true
    columns:
      # ------------------------------------------------------------------------
      # Left Column: World Clocks, Bengaluru Telemetry, Host Stats & Vault
      # ------------------------------------------------------------------------
      - size: small
        widgets:
          - type: clock
            title: World Flight Deck
            hour-format: 24h
            timezones:
              - timezone: Asia/Kolkata
                label: "Bengaluru (BLR / Home)"
              - timezone: America/Los_Angeles
                label: "Mountain View (MTV)"
              - timezone: UTC
                label: "Zulu / Aviation UTC"
              - timezone: Europe/London
                label: "London (LHR / West End)"

          - type: weather
            title: Bengaluru Telemetry
            location: Bengaluru, India
            units: metric
            hour-format: 24h

          - type: server-stats
            title: M1 Pro Host & Storage
            servers:
              - type: local
                name: "Sol (M1 Pro • 8C / 16GB)"
                hide-mountpoints-by-default: true
                mountpoints:
                  "/":
                    name: "OrbStack VM"
                    hide: false
                  "/media/panopticon":
                    name: "PANOPTICON (22TB)"
                    hide: false

          - type: custom-api
            title: Paperless-ngx Vault
            title-url: https://docs.vrg.rocks
            cache: 10m
            options:
              api-key: ${PAPERLESS_API_KEY}
            template: |
              {{ $apiKey := .Options.StringOr "api-key" "" }}
              {{ if eq $apiKey "" }}
                <div class="sol-hint">
                  Set <code>PAPERLESS_API_KEY</code> in <code>.env</code> to display live document and OCR counts from <code>paperless-webserver:8000</code>.
                </div>
              {{ else }}
                {{ $resp := newRequest "http://paperless-webserver:8000/api/statistics/"
                    | withHeader "Authorization" (concat "Token " $apiKey)
                    | withHeader "Accept" "application/json; version=6"
                    | getResponse }}
                {{ if eq $resp.Response.StatusCode 200 }}
                  <div class="sol-stat-grid">
                    <div class="sol-stat-card">
                      <div class="sol-stat-value color-primary">{{ $resp.JSON.Int "documents_total" | formatNumber }}</div>
                      <div class="sol-stat-label">Total Docs</div>
                    </div>
                    <div class="sol-stat-card">
                      <div class="sol-stat-value {{ if gt ($resp.JSON.Int "documents_inbox") 0 }}color-negative{{ else }}color-positive{{ end }}">
                        {{ $resp.JSON.Int "documents_inbox" | formatNumber }}
                      </div>
                      <div class="sol-stat-label">Inbox Queue</div>
                    </div>
                    <div class="sol-stat-card">
                      <div class="sol-stat-value">{{ $resp.JSON.Int "character_count" | formatApproxNumber }}</div>
                      <div class="sol-stat-label">OCR Chars</div>
                    </div>
                  </div>
                {{ else }}
                  <div class="sol-hint">Paperless API returned HTTP {{ $resp.Response.StatusCode }}</div>
                {{ end }}
              {{ end }}

          - type: calendar
            title: Calendar
            first-day-of-week: monday

      # ------------------------------------------------------------------------
      # Center Column: Bang Search, Service Mesh Monitors & Complete Directory
      # ------------------------------------------------------------------------
      - size: full
        widgets:
          - type: search
            title: Command & Bang Bar
            search-engine: google
            autofocus: true
            new-tab: true
            bangs:
              - title: Jellyfin Container
                shortcut: "!jf"
                url: https://media.vrg.rocks/web/index.html#!/search.html?query={QUERY}
              - title: Jellyfin Metal
                shortcut: "!metal"
                url: https://metal.vrg.rocks/web/index.html#!/search.html?query={QUERY}
              - title: Seerr Media Requests
                shortcut: "!req"
                url: https://request.vrg.rocks/search?query={QUERY}
              - title: Radarr Add Movie
                shortcut: "!rad"
                url: https://radarr.vrg.rocks/add/new?term={QUERY}
              - title: Sonarr Add Series
                shortcut: "!son"
                url: https://sonarr.vrg.rocks/add/new?term={QUERY}
              - title: Prowlarr Indexer Search
                shortcut: "!prowl"
                url: https://prowlarr.vrg.rocks/search?query={QUERY}
              - title: Paperless-ngx Documents
                shortcut: "!docs"
                url: https://docs.vrg.rocks/documents?title_content={QUERY}
              - title: Letterboxd Film Lookup
                shortcut: "!lb"
                url: https://letterboxd.com/search/{QUERY}/
              - title: IMDb Search
                shortcut: "!imdb"
                url: https://www.imdb.com/find/?q={QUERY}
              - title: TMDB Search
                shortcut: "!tmdb"
                url: https://www.themoviedb.org/search?query={QUERY}
              - title: Blu-ray.com 4K UHD Search
                shortcut: "!blu"
                url: https://www.blu-ray.com/search/?quicksearch=1&quicksearch_keyword={QUERY}
              - title: YouTube
                shortcut: "!yt"
                url: https://www.youtube.com/results?search_query={QUERY}
              - title: GitHub
                shortcut: "!gh"
                url: https://github.com/search?q={QUERY}
              - title: MDN Web Docs
                shortcut: "!mdn"
                url: https://developer.mozilla.org/en-US/search?q={QUERY}
              - title: Can I Use
                shortcut: "!caniuse"
                url: https://caniuse.com/?search={QUERY}
              - title: Flightradar24 Live Tracker
                shortcut: "!fr24"
                url: https://www.flightradar24.com/{QUERY}

          - type: monitor
            title: Core Ingress, Identity, Docs & Static Web Apps
            cache: 1m
            style: compact
            sites:
              - title: Authentik SSO
                url: https://auth.vrg.rocks
                check-url: http://authentik-server:9000/-/health/live/
                icon: si:authentik
              - title: Arcane Docker Ops
                url: https://arcane.vrg.rocks
                check-url: http://arcane:3552
                icon: si:docker
              - title: Code-Server IDE
                url: https://code.vrg.rocks
                check-url: http://code-server:8443/healthz
                icon: si:visualstudiocode
              - title: Paperless-ngx
                url: https://docs.vrg.rocks
                check-url: http://paperless-webserver:8000
                icon: si:paperlessngx
              - title: Stirling-PDF
                url: https://pdf.vrg.rocks
                check-url: http://stirling-pdf:8080/api/v1/info/status
                icon: si:adobeacrobatreader
              - title: ChangeDetection
                url: https://cd.vrg.rocks
                check-url: http://changedetection:5000
                icon: si:rss
              - title: CopyParty
                url: https://files.vrg.rocks
                check-url: http://copyparty:3923
                icon: si:files
              - title: Syncthing
                url: https://sync.vrg.rocks
                check-url: http://syncthing:8384/rest/noauth/health
                icon: si:syncthing
              - title: PairDrop LAN
                url: https://drop.vrg.rocks
                check-url: http://pairdrop:3000
                icon: si:airplayaudio
              - title: OpenSpeedTest
                url: https://speed.vrg.rocks
                check-url: http://openspeedtest:3000
                icon: si:speedtest
              - title: Quartz Garden (/mind)
                url: https://vrg.rocks/mind/
                icon: si:obsidian
              - title: Family Vault (/fam)
                url: https://vrg.rocks/fam/
                icon: si:googlephotos
              - title: Homebox Scanner (/scan)
                url: https://scan.vrg.rocks
                icon: si:pwa
              - title: AYSYNBM (/aysynbm)
                url: https://vrg.rocks/aysynbm/
                icon: si:html5

          - type: monitor
            title: Media, PVR & Acquisition Mesh
            cache: 1m
            style: compact
            sites:
              - title: Jellyfin Container
                url: https://media.vrg.rocks
                check-url: http://jellyfin:8096/health
                icon: si:jellyfin
              - title: Jellyfin Metal (Native)
                url: https://metal.vrg.rocks
                check-url: http://host.docker.internal:8097/health
                icon: si:apple
              - title: Seerr Requests
                url: https://request.vrg.rocks
                check-url: http://seerr:5055/api/v1/status
                icon: si:themoviedatabase
              - title: Radarr Movies
                url: https://radarr.vrg.rocks
                check-url: http://radarr:7878/ping
                icon: si:radarr
              - title: Sonarr TV
                url: https://sonarr.vrg.rocks
                check-url: http://sonarr:8989/ping
                icon: si:sonarr
              - title: Prowlarr Indexers
                url: https://prowlarr.vrg.rocks
                check-url: http://prowlarr:9696/ping
                icon: si:prowlarr
              - title: Bazarr Subtitles
                url: https://bazarr.vrg.rocks
                check-url: http://bazarr:6767/ping
                icon: si:subtitles
              - title: qBittorrent
                url: https://qb.vrg.rocks
                check-url: http://qbittorrent:8080
                icon: si:qbittorrent
              - title: QUI Interface
                url: https://qui.vrg.rocks
                check-url: http://qui:7476
                icon: si:bittorrent
              - title: Byparr Turnstile Solver
                url: https://byparr.vrg.rocks
                check-url: http://byparr:8191
                icon: si:cloudflare

          - type: bookmarks
            title: Sol Service Directory & Standby Catalog
            groups:
              - title: Core, LAN & Dev
                color: 267 84 81
                links:
                  - title: Authentik IdP
                    url: https://auth.vrg.rocks
                    icon: si:authentik
                  - title: Arcane Docker UI
                    url: https://arcane.vrg.rocks
                    icon: si:docker
                  - title: Glance Dashboard
                    url: https://dash.vrg.rocks
                    icon: /assets/sol.svg
                  - title: Code-Server IDE
                    url: https://code.vrg.rocks
                    icon: si:visualstudiocode
                  - title: Home Gateway Router
                    url: https://router.vrg.rocks
                    icon: si:openwrt
                  - title: Home Assistant
                    url: https://home.vrg.rocks
                    icon: si:homeassistant
                  - title: Cloud Manager
                    url: https://cm.vrg.rocks
                    icon: si:cloudflare
              - title: Media & Acquisition
                color: 38 95 65
                links:
                  - title: Jellyfin Container
                    url: https://media.vrg.rocks
                    icon: si:jellyfin
                  - title: Jellyfin Metal (8097)
                    url: https://metal.vrg.rocks
                    icon: si:apple
                  - title: Seerr Requests
                    url: https://request.vrg.rocks
                    icon: si:themoviedatabase
                  - title: Radarr (Movies)
                    url: https://radarr.vrg.rocks
                    icon: si:radarr
                  - title: Sonarr (TV)
                    url: https://sonarr.vrg.rocks
                    icon: si:sonarr
                  - title: Prowlarr (Indexers)
                    url: https://prowlarr.vrg.rocks
                    icon: si:prowlarr
                  - title: Bazarr (Subtitles)
                    url: https://bazarr.vrg.rocks
                    icon: si:subtitles
                  - title: qBittorrent (WebUI)
                    url: https://qb.vrg.rocks
                    icon: si:qbittorrent
                  - title: QUI (Alt WebUI)
                    url: https://qui.vrg.rocks
                    icon: si:bittorrent
                  - title: Byparr Solver
                    url: https://byparr.vrg.rocks
                    icon: si:cloudflare
              - title: Docs, Files & Static Apps
                color: 188 86 64
                links:
                  - title: Paperless-ngx Vault
                    url: https://docs.vrg.rocks
                    icon: si:paperlessngx
                  - title: Stirling-PDF Suite
                    url: https://pdf.vrg.rocks
                    icon: si:adobeacrobatreader
                  - title: CopyParty File Server
                    url: https://files.vrg.rocks
                    icon: si:files
                  - title: Syncthing Mesh
                    url: https://sync.vrg.rocks
                    icon: si:syncthing
                  - title: PairDrop LAN Share
                    url: https://drop.vrg.rocks
                    icon: si:airplayaudio
                  - title: ChangeDetection.io
                    url: https://cd.vrg.rocks
                    icon: si:rss
                  - title: OpenSpeedTest
                    url: https://speed.vrg.rocks
                    icon: si:speedtest
                  - title: Quartz Digital Garden
                    url: https://vrg.rocks/mind/
                    icon: si:obsidian
                  - title: Family Vault
                    url: https://vrg.rocks/fam/
                    icon: si:googlephotos
                  - title: Homebox Scanner PWA
                    url: https://scan.vrg.rocks
                    icon: si:pwa
                  - title: AYSYNBM
                    url: https://vrg.rocks/aysynbm/
                    icon: si:html5
              - title: Standby Fleet (--profile standby)
                color: 220 15 62
                links:
                  - title: Audiobookshelf (audio)
                    url: https://audio.vrg.rocks
                    icon: si:audiobookshelf
                  - title: Calibre-Web (books)
                    url: https://books.vrg.rocks
                    icon: si:calibreweb
                  - title: Komga Comics (comics)
                    url: https://comics.vrg.rocks
                    icon: si:komga
                  - title: Navidrome Music (music)
                    url: https://music.vrg.rocks
                    icon: si:navidrome
                  - title: Tautulli Analytics (stats)
                    url: https://stats.vrg.rocks
                    icon: si:tautulli
                  - title: ErsatzTV Channels (tv)
                    url: https://tv.vrg.rocks
                    icon: si:livewire
                  - title: Hoarder Bookmarks (links)
                    url: https://links.vrg.rocks
                    icon: si:bookmark
                  - title: FreshRSS Reader (rss)
                    url: https://rss.vrg.rocks
                    icon: si:freshrss
                  - title: Mealie Recipes (recipes)
                    url: https://recipes.vrg.rocks
                    icon: si:mealie
                  - title: Homebox Inventory (items)
                    url: https://items.vrg.rocks
                    icon: si:box
                  - title: Excalidraw Canvas (draw)
                    url: https://draw.vrg.rocks
                    icon: si:excalidraw
                  - title: IT-Tools Suite (tools)
                    url: https://tools.vrg.rocks
                    icon: si:serverless
                  - title: CyberChef Swiss Knife (chef)
                    url: https://chef.vrg.rocks
                    icon: si:Gnuprivacyguard
                  - title: Coder Workspaces (coder)
                    url: https://coder.vrg.rocks
                    icon: si:coder
                  - title: Uptime Kuma (status)
                    url: https://status.vrg.rocks
                    icon: si:uptimekuma
                  - title: Beszel Hub (monitor)
                    url: https://monitor.vrg.rocks
                    icon: si:grafana

      # ------------------------------------------------------------------------
      # Right Column: Live Docker Socket Fleet & Ops Scratchpad
      # ------------------------------------------------------------------------
      - size: small
        widgets:
          - type: docker-containers
            title: Active Docker Fleet
            sock-path: /var/run/docker.sock
            running-only: false
            format-container-names: true
            hide-by-default: false

          - type: to-do
            title: Sol Ops Scratchpad
            id: sol-ops-todo

  # ============================================================================
  # PAGE 2: CINEMA & MEDIA — 22TB PANOPTICON & IMAX PIPELINE (/media)
  # ============================================================================
  - name: Cinema & Media
    slug: media
    width: wide
    show-mobile-header: true
    columns:
      # ------------------------------------------------------------------------
      # Left Column: Dual Jellyfin Telemetry, Seerr Queue & Prowlarr Health
      # ------------------------------------------------------------------------
      - size: small
        widgets:
          - type: group
            widgets:
              - type: custom-api
                title: Jellyfin Container
                title-url: https://media.vrg.rocks
                cache: 2m
                options:
                  api-key: ${JELLYFIN_API_KEY}
                template: |
                  {{ $apiKey := .Options.StringOr "api-key" "" }}
                  {{ $pub := newRequest "http://jellyfin:8096/System/Info/Public" | getResponse }}
                  {{ if eq $pub.Response.StatusCode 200 }}
                    <div class="flex justify-between items-center margin-bottom-10">
                      <span class="size-h5 color-highlight">{{ $pub.JSON.String "ServerName" }}</span>
                      <span class="sol-badge sol-badge--ok">v{{ $pub.JSON.String "Version" }}</span>
                    </div>
                  {{ end }}
                  {{ if eq $apiKey "" }}
                    <div class="sol-hint">
                      Set <code>JELLYFIN_API_KEY</code> in <code>.env</code> for live library counts and active stream telemetry.
                    </div>
                  {{ else }}
                    {{ $counts := newRequest "http://jellyfin:8096/Items/Counts"
                        | withHeader "X-Emby-Token" $apiKey
                        | getResponse }}
                    {{ $sessions := newRequest "http://jellyfin:8096/Sessions"
                        | withHeader "X-Emby-Token" $apiKey
                        | getResponse }}
                    {{ if eq $counts.Response.StatusCode 200 }}
                      <div class="sol-stat-grid">
                        <div class="sol-stat-card">
                          <div class="sol-stat-value color-primary">{{ $counts.JSON.Int "MovieCount" | formatNumber }}</div>
                          <div class="sol-stat-label">Movies</div>
                        </div>
                        <div class="sol-stat-card">
                          <div class="sol-stat-value">{{ $counts.JSON.Int "SeriesCount" | formatNumber }}</div>
                          <div class="sol-stat-label">Series</div>
                        </div>
                        <div class="sol-stat-card">
                          <div class="sol-stat-value">{{ $counts.JSON.Int "EpisodeCount" | formatNumber }}</div>
                          <div class="sol-stat-label">Episodes</div>
                        </div>
                      </div>
                    {{ end }}
                    {{ if eq $sessions.Response.StatusCode 200 }}
                      {{ $activeStreams := $sessions.JSON.Array "#(NowPlayingItem.Name!=)" }}
                      <div class="margin-top-10 size-h6 color-subdue">
                        Active Streams: <strong class="color-highlight">{{ len $activeStreams }}</strong>
                      </div>
                      {{ range $activeStreams }}
                        <div class="margin-top-6 size-h6">
                          <span class="sol-badge sol-badge--info">{{ .String "Client" }}</span>
                          <strong class="color-highlight">{{ .String "NowPlayingItem.Name" }}</strong>
                          <span class="color-subdue">({{ .String "UserName" }})</span>
                        </div>
                      {{ end }}
                    {{ end }}
                  {{ end }}

              - type: custom-api
                title: Jellyfin Metal
                title-url: https://metal.vrg.rocks
                cache: 2m
                options:
                  api-key: ${JELLYFIN_METAL_API_KEY}
                template: |
                  {{ $apiKey := .Options.StringOr "api-key" "" }}
                  {{ $pub := newRequest "http://host.docker.internal:8097/System/Info/Public" | getResponse }}
                  {{ if eq $pub.Response.StatusCode 200 }}
                    <div class="flex justify-between items-center margin-bottom-10">
                      <span class="size-h5 color-highlight">{{ $pub.JSON.String "ServerName" }} (Apple VideoToolbox)</span>
                      <span class="sol-badge sol-badge--ok">v{{ $pub.JSON.String "Version" }}</span>
                    </div>
                  {{ else }}
                    <div class="sol-hint">Native macOS daemon on <code>host.docker.internal:8097</code> is offline.</div>
                  {{ end }}
                  {{ if ne $apiKey "" }}
                    {{ $counts := newRequest "http://host.docker.internal:8097/Items/Counts"
                        | withHeader "X-Emby-Token" $apiKey
                        | getResponse }}
                    {{ if eq $counts.Response.StatusCode 200 }}
                      <div class="sol-stat-grid">
                        <div class="sol-stat-card">
                          <div class="sol-stat-value color-primary">{{ $counts.JSON.Int "MovieCount" | formatNumber }}</div>
                          <div class="sol-stat-label">Movies</div>
                        </div>
                        <div class="sol-stat-card">
                          <div class="sol-stat-value">{{ $counts.JSON.Int "SeriesCount" | formatNumber }}</div>
                          <div class="sol-stat-label">Series</div>
                        </div>
                        <div class="sol-stat-card">
                          <div class="sol-stat-value">{{ $counts.JSON.Int "EpisodeCount" | formatNumber }}</div>
                          <div class="sol-stat-label">Episodes</div>
                        </div>
                      </div>
                    {{ end }}
                  {{ else }}
                    <div class="sol-hint">
                      Optional: Set <code>JELLYFIN_METAL_API_KEY</code> in <code>.env</code> for native Metal library counts.
                    </div>
                  {{ end }}

          - type: custom-api
            title: Seerr Media Requests
            title-url: https://request.vrg.rocks
            cache: 2m
            options:
              api-key: ${SEERR_API_KEY}
            template: |
              {{ $apiKey := .Options.StringOr "api-key" "" }}
              {{ if eq $apiKey "" }}
                <div class="sol-hint">
                  Set <code>SEERR_API_KEY</code> in <code>.env</code> (from <code>config/seerr/settings.json</code>) to view request queue counts.
                </div>
              {{ else }}
                {{ $resp := newRequest "http://seerr:5055/api/v1/request/count"
                    | withHeader "X-Api-Key" $apiKey
                    | getResponse }}
                {{ if eq $resp.Response.StatusCode 200 }}
                  <div class="sol-stat-grid">
                    <div class="sol-stat-card">
                      <div class="sol-stat-value color-primary">{{ $resp.JSON.Int "pending" }}</div>
                      <div class="sol-stat-label">Pending</div>
                    </div>
                    <div class="sol-stat-card">
                      <div class="sol-stat-value">{{ $resp.JSON.Int "processing" }}</div>
                      <div class="sol-stat-label">Processing</div>
                    </div>
                    <div class="sol-stat-card">
                      <div class="sol-stat-value color-positive">{{ $resp.JSON.Int "available" }}</div>
                      <div class="sol-stat-label">Available</div>
                    </div>
                  </div>
                {{ else }}
                  <div class="sol-hint">Seerr API returned HTTP {{ $resp.Response.StatusCode }}</div>
                {{ end }}
              {{ end }}

          - type: custom-api
            title: Prowlarr Indexers & Byparr
            title-url: https://prowlarr.vrg.rocks
            cache: 5m
            options:
              api-key: ${PROWLARR_API_KEY}
            template: |
              {{ $apiKey := .Options.StringOr "api-key" "" }}
              {{ if eq $apiKey "" }}
                <div class="sol-hint">
                  Set <code>PROWLARR_API_KEY</code> in <code>.env</code> (from <code>config/prowlarr/config.xml</code>) to monitor indexer health.
                </div>
              {{ else }}
                {{ $indexers := newRequest "http://prowlarr:9696/api/v1/indexer"
                    | withHeader "X-Api-Key" $apiKey
                    | getResponse }}
                {{ $health := newRequest "http://prowlarr:9696/api/v1/health"
                    | withHeader "X-Api-Key" $apiKey
                    | getResponse }}
                {{ if eq $indexers.Response.StatusCode 200 }}
                  {{ $all := $indexers.JSON.Array "" }}
                  {{ $enabled := $indexers.JSON.Array "#(enable==true)#" }}
                  {{ $issues := $health.JSON.Array "" }}
                  <div class="sol-stat-grid">
                    <div class="sol-stat-card">
                      <div class="sol-stat-value color-positive">{{ len $enabled }}</div>
                      <div class="sol-stat-label">Enabled</div>
                    </div>
                    <div class="sol-stat-card">
                      <div class="sol-stat-value">{{ len $all }}</div>
                      <div class="sol-stat-label">Total</div>
                    </div>
                    <div class="sol-stat-card">
                      <div class="sol-stat-value {{ if gt (len $issues) 0 }}color-negative{{ else }}color-positive{{ end }}">
                        {{ len $issues }}
                      </div>
                      <div class="sol-stat-label">Alerts</div>
                    </div>
                  </div>
                  {{ range $issues }}
                    <div class="margin-top-8 size-h6 color-negative">• {{ .String "message" }}</div>
                  {{ end }}
                {{ else }}
                  <div class="sol-hint">Prowlarr API returned HTTP {{ $indexers.Response.StatusCode }}</div>
