# ==============================================================================
# Sol Home Server — Declarative Glance Command Center (v0.8+)
# ==============================================================================
# Host: Apple MacBook Pro (14-inch, 2021) • Apple M1 Pro (8C / 16GB RAM)
# Storage: 512GB Internal NVMe + 2TB ExFAT (PANOPTICON)
# Ingress: https://dash.vrg.rocks & https://sol.vrg.rocks (-> /sol)
# ==============================================================================

server:
  assets-path: /app/assets

branding:
  app-name: "Sol"
  logo-text: "Sol"
  logo-url: /assets/sol.svg
  favicon-url: /assets/sol.svg
  app-icon-url: /assets/sol.svg
  custom-footer: '<p class="size-h6 color-subdue">Sol Home Server • Apple M1 Pro (8C / 16GB) + PANOPTICON • Therapist for Thinking Sand</p>'

theme:
  custom-css-file: /assets/user.css
  background-color: 240 21 15
  contrast-multiplier: 1.2
  primary-color: 267 84 81
  positive-color: 115 54 76
  negative-color: 347 87 68
  presets:
    sol-catppuccin-mocha:
      background-color: 240 21 15
      contrast-multiplier: 1.2
      primary-color: 267 84 81
      positive-color: 115 54 76
      negative-color: 347 87 68
    sol-gm3-obsidian:
      background-color: 220 20 8
      contrast-multiplier: 1.25
      primary-color: 215 90 75
      positive-color: 142 65 65
      negative-color: 355 85 68
    sol-imax-amber:
      background-color: 225 18 9
      contrast-multiplier: 1.25
      primary-color: 38 95 65
      positive-color: 145 63 62
      negative-color: 354 84 66
    sol-cockpit-ecam:
      background-color: 210 25 9
      contrast-multiplier: 1.25
      primary-color: 188 86 64
      positive-color: 135 68 62
      negative-color: 36 95 62

pages:
  # ============================================================================
  # PAGE 1: SOL — UNIFIED HOME & SERVER LANDING PAGE (/sol)
  # ============================================================================
  # Combines the original Home and Sol pages into a breathable, mobile-friendly
  # command deck. Serves `/` and `/sol` (matching `sol.vrg.rocks` 302 redirect).
  - name: Sol
    slug: sol
    width: wide
    head-widgets:
      - type: search
        hide-header: true
        search-engine: google
        autofocus: true
        new-tab: true
        bangs:
          - title: Jellyfin
            shortcut: "!jf"
            url: https://watch.vrg.rocks/web/index.html#!/search.html?query={QUERY}
          - title: Seerr Requests
            shortcut: "!req"
            url: https://request.vrg.rocks/search?query={QUERY}
          - title: Radarr Add Movie
            shortcut: "!rad"
            url: https://radarr.vrg.rocks/add/new?term={QUERY}
          - title: Sonarr Add Series
            shortcut: "!son"
            url: https://sonarr.vrg.rocks/add/new?term={QUERY}
          - title: Prowlarr Indexers
            shortcut: "!prowl"
            url: https://prowlarr.vrg.rocks/search?query={QUERY}
          - title: Paperless-ngx Vault
            shortcut: "!docs"
            url: https://docs.vrg.rocks/documents?title_content={QUERY}
          - title: Letterboxd
            shortcut: "!lb"
            url: https://letterboxd.com/search/{QUERY}/
          - title: IMDb
            shortcut: "!imdb"
            url: https://www.imdb.com/find/?q={QUERY}
          - title: YouTube
            shortcut: "!yt"
            url: https://www.youtube.com/results?search_query={QUERY}
          - title: GitHub
            shortcut: "!gh"
            url: https://github.com/search?q={QUERY}

    columns:
      # ------------------------------------------------------------------------
      # Left Column: Bengaluru Weather, World Flight Deck Clocks & Calendar
      # ------------------------------------------------------------------------
      - size: small
        widgets:
          - type: weather
            title: Bengaluru Weather
            location: Bengaluru, India
            units: metric
            hour-format: 12h

          - type: clock
            title: World Flight Deck
            hour-format: 24h
            timezones:
              - timezone: Asia/Kolkata
                label: "Bengaluru (BLR)"
              - timezone: America/Los_Angeles
                label: "Mountain View (MTV)"
              - timezone: UTC
                label: "Aviation / Zulu UTC"

          - type: calendar
            title: Calendar
            first-day-of-week: sunday

      # ------------------------------------------------------------------------
      # Center Column: Sol Application Launcher, Daily Pulse & Featured Video
      # ------------------------------------------------------------------------
      - size: full
        widgets:
          - type: bookmarks
            title: Sol Applications
            groups:
              - title: Media & Servarr
                color: 38 95 65
                links:
                  - title: Jellyfin
                    url: https://watch.vrg.rocks
                    icon: sh:jellyfin
                  - title: Seerr
                    url: https://request.vrg.rocks
                    icon: sh:seerr
                  - title: Radarr
                    url: https://radarr.vrg.rocks
                    icon: sh:radarr
                  - title: Sonarr
                    url: https://sonarr.vrg.rocks
                    icon: sh:sonarr
                  - title: Prowlarr
                    url: https://prowlarr.vrg.rocks
                    icon: sh:prowlarr
                  - title: Byparr
                    url: https://byparr.vrg.rocks
                    icon: sh:flaresolverr
                  - title: Bazarr
                    url: https://bazarr.vrg.rocks
                    icon: sh:bazarr
                  - title: Lidarr
                    url: https://lidarr.vrg.rocks
                    icon: sh:lidarr
                  - title: qBittorrent
                    url: https://qb.vrg.rocks
                    icon: sh:qbittorrent
                  - title: QUI
                    url: https://qui.vrg.rocks
                    icon: sh:qui

              - title: Knowledge, Inventory & Web
                color: 188 86 64
                links:
                  - title: Paperless-ngx
                    url: https://docs.vrg.rocks
                    icon: sh:paperless-ngx
                  - title: Readeck Links
                    url: https://links.vrg.rocks
                    icon: sh:readeck
                  - title: Ignis Vault
                    url: https://ignis.vrg.rocks
                    icon: sh:obsidian
                  - title: Quettamind
                    url: https://mind.vrg.rocks
                    icon: sh:obsidian
                  - title: Family Vault
                    url: https://fam.vrg.rocks
                    icon: sh:html5
                  - title: Homebox Inventory
                    url: https://inv.vrg.rocks
                    icon: sh:homebox
                  - title: Homebox Scanner
                    url: https://scan.vrg.rocks
                    icon: sh:homebox
                  - title: AirTrail Flights
                    url: https://fly.vrg.rocks
                    icon: sh:airtrail
                  - title: Enclosed Notes
                    url: https://send.vrg.rocks
                    icon: sh:enclosed
                  - title: AYSYNBM
                    url: https://aysynbm.vrg.rocks
                    icon: sh:html5

              - title: Workspace, Tools & Infrastructure
                color: 115 54 76
                links:
                  - title: VS Code Server
                    url: https://code.vrg.rocks
                    icon: sh:visual-studio-code
                  - title: Coder Platform
                    url: https://coder.vrg.rocks
                    icon: sh:coder
                  - title: PocketBase
                    url: https://pb.vrg.rocks
                    icon: sh:pocketbase
                  - title: IT-Tools
                    url: https://tools.vrg.rocks
                    icon: sh:it-tools
                  - title: CyberChef
                    url: https://chef.vrg.rocks
                    icon: sh:cyberchef
                  - title: BentoPDF
                    url: https://pdf.vrg.rocks
                    icon: sh:bentopdf
                  - title: MediaInfo Web
                    url: https://mi.vrg.rocks
                    icon: si:dolby
                  - title: OpenSpeedTest
                    url: https://speed.vrg.rocks
                    icon: sh:openspeedtest
                  - title: Excalidraw
                    url: https://draw.vrg.rocks
                    icon: sh:excalidraw
                  - title: Copyparty Files
                    url: https://files.vrg.rocks
                    icon: sh:copyparty
                  - title: ntfy Alerts
                    url: https://ntfy.vrg.rocks
                    icon: sh:ntfy
                  - title: Tinyauth SSO
                    url: https://auth.vrg.rocks
                    icon: di:tinyauth
                  - title: lldap Directory
                    url: https://ldap.vrg.rocks
                    icon: sh:lldap
                  - title: Arcane Docker
                    url: https://arcane.vrg.rocks
                    icon: sh:arcane
                  - title: Backrest Backups
                    url: https://backrest.vrg.rocks
                    icon: sh:backrest
                  - title: Router Gateway
                    url: https://router.vrg.rocks
                    icon: sh:openrouter

          - type: group
            widgets:
              - type: hacker-news
                title: Hacker News
                limit: 12
                collapse-after: 5
                sort-by: top

              - type: lobsters
                title: Lobste.rs
                limit: 12
                collapse-after: 5

              - type: rss
                title: Featured Blogs
                limit: 10
                collapse-after: 5
                cache: 12h
                feeds:
                  - url: https://selfh.st/rss/
                    title: selfh.st
                    limit: 4
                  - url: https://ciechanow.ski/atom.xml
                    title: Bartosz Ciechanowski
                  - url: https://www.joshwcomeau.com/rss.xml
                    title: Josh Comeau
                  - url: https://samwho.dev/rss.xml
                    title: Sam Rose
                  - url: https://ishadeed.com/feed.xml
                    title: Ahmad Shadeed

          - type: videos
            title: Featured Channels
            style: horizontal-cards
            channels:
              - UCXuqSBlHAE6Xw-yeJA0Tunw # Linus Tech Tips
              - UCR-DXc1voovS8nhAvccRZhg # Jeff Geerling
              - UCsBjURrPoezykLs9EqgamOA # Fireship
              - UCBJycsmduvYEL83R_U4JriQ # Marques Brownlee
              - UCHnyfMqiRRG1u-2MsSQLbXA # Veritasium
              - UCjFqcJQXGZ6T6sxyFB-5i6A # Every Frame a Painting
              - UCwpHKudUkP5tNgmMdexB3ow # Mentour Pilot
              - UCYO_jab_esuFRV4b17AJtAw # 3Blue1Brown

      # ------------------------------------------------------------------------
      # Right Column: Host Storage Telemetry, Core Health Summary & Markets
      # ------------------------------------------------------------------------
      - size: small
        widgets:
          - type: server-stats
            title: Sol Host & Storage
            servers:
              - type: local
                name: "Sol (M1 Pro • 8C / 16GB)"
                hide-mountpoints-by-default: true
                mountpoints:
                  "/":
                    name: "Internal NVMe (512GB)"
                    hide: false
                  "/media/panopticon":
                    name: "PANOPTICON (2TB ExFAT)"
                    hide: false

          - type: monitor
            title: Core Stack Status
            cache: 1m
            style: compact
            sites:
              - title: Caddy Ingress
                url: https://dash.vrg.rocks
                check-url: https://auth.vrg.rocks/api/healthz
                icon: sh:caddy
              - title: Tinyauth SSO
                url: https://auth.vrg.rocks
                check-url: http://tinyauth:3000/api/healthz
                icon: di:tinyauth
              - title: Arcane Docker
                url: https://arcane.vrg.rocks
                check-url: http://arcane:3552
                icon: sh:arcane
              - title: Jellyfin
                url: https://watch.vrg.rocks
                check-url: http://jellyfin:8096/health
                icon: sh:jellyfin
              - title: Seerr
                url: https://request.vrg.rocks
                check-url: http://seerr:5055/api/v1/status
                icon: sh:seerr
              - title: Paperless-ngx
                url: https://docs.vrg.rocks
                check-url: http://paperless-webserver:8000
                icon: sh:paperless-ngx
              - title: qBittorrent
                url: https://qb.vrg.rocks
                check-url: http://qbittorrent:8080
                icon: sh:qbittorrent
              - title: Radarr
                url: https://radarr.vrg.rocks
                check-url: http://radarr:7878/ping
                icon: sh:radarr
              - title: Sonarr
                url: https://sonarr.vrg.rocks
                check-url: http://sonarr:8989/ping
                icon: sh:sonarr

          - type: markets
            title: Markets
            markets:
              - symbol: GOOG
                name: Google
              - symbol: BTC-USD
                name: Bitcoin
              - symbol: NVDA
                name: NVIDIA
              - symbol: AAPL
                name: Apple
              - symbol: MSFT
                name: Microsoft

  # ============================================================================
  # PAGE 2: STATS & OPS — LIVE SERVER & API TELEMETRY (/stats)
  # ============================================================================
  - name: Stats & Ops
    slug: stats
    width: wide
    columns:
      # ------------------------------------------------------------------------
      # Left Column: Jellyfin, Seerr, Prowlarr & Paperless-ngx Live API Cards
      # ------------------------------------------------------------------------
      - size: small
        widgets:
          - type: custom-api
            title: Jellyfin Library & Streams
            title-url: https://watch.vrg.rocks
            cache: 2m
            options:
              api-key: ${JELLYFIN_API_KEY}
            template: |
              {{ $apiKey := .Options.StringOr "api-key" "" }}
              {{ $pub := newRequest "http://jellyfin:8096/System/Info/Public" | getResponse }}
              {{ if eq $pub.Response.StatusCode 200 }}
                <div class="flex justify-between items-center margin-bottom-10">
                  <span class="size-h5 color-highlight">{{ $pub.JSON.String "ServerName" }}</span>
                  <span class="sol-badge sol-badge--ok">v{{ $pub.JSON.String "Version" }}</span>
                </div>
              {{ end }}
              {{ if eq $apiKey "" }}
                <div class="sol-hint">
                  Set <code>JELLYFIN_API_KEY</code> in <code>.env</code> for live library counts and active stream telemetry.
                </div>
              {{ else }}
                {{ $authHeader := concat "MediaBrowser Token=\"" $apiKey "\"" }}
                {{ $counts := newRequest "http://jellyfin:8096/Items/Counts"
                    | withHeader "Authorization" $authHeader
                    | getResponse }}
                {{ $sessions := newRequest "http://jellyfin:8096/Sessions"
                    | withHeader "Authorization" $authHeader
                    | getResponse }}
                {{ if eq $counts.Response.StatusCode 200 }}
                  <div class="sol-stat-grid">
                    <div class="sol-stat-card">
                      <div class="sol-stat-value color-primary">{{ $counts.JSON.Int "MovieCount" | formatNumber }}</div>
                      <div class="sol-stat-label">Movies</div>
                    </div>
                    <div class="sol-stat-card">
                      <div class="sol-stat-value">{{ $counts.JSON.Int "SeriesCount" | formatNumber }}</div>
                      <div class="sol-stat-label">Series</div>
                    </div>
                    <div class="sol-stat-card">
                      <div class="sol-stat-value">{{ $counts.JSON.Int "EpisodeCount" | formatNumber }}</div>
                      <div class="sol-stat-label">Episodes</div>
                    </div>
                  </div>
                {{ else }}
                  <div class="sol-hint">Jellyfin API returned HTTP {{ $counts.Response.StatusCode }}</div>
                {{ end }}
                {{ if eq $sessions.Response.StatusCode 200 }}
                  {{ $activeStreams := $sessions.JSON.Array "#(NowPlayingItem.Name!=)#" }}
                  <div class="margin-top-10 size-h6 color-subdue">
                    Active Streams: <strong class="color-highlight">{{ len $activeStreams }}</strong>
                  </div>
                  {{ range $activeStreams }}
                    <div class="margin-top-6 size-h6">
                      <span class="sol-badge sol-badge--info">{{ .String "Client" }}</span>
                      <strong class="color-highlight">{{ .String "NowPlayingItem.Name" }}</strong>
                      <span class="color-subdue">({{ .String "UserName" }})</span>
                    </div>
                  {{ end }}
                {{ end }}
              {{ end }}

          - type: custom-api
            title: Seerr Request Queue
            title-url: https://request.vrg.rocks
            cache: 2m
            options:
              api-key: ${SEERR_API_KEY}
            template: |
              {{ $apiKey := .Options.StringOr "api-key" "" }}
              {{ if eq $apiKey "" }}
                <div class="sol-hint">
                  Set <code>SEERR_API_KEY</code> in <code>.env</code> to view request queue counts.
                </div>
              {{ else }}
                {{ $resp := newRequest "http://seerr:5055/api/v1/request/count"
                    | withHeader "X-Api-Key" $apiKey
                    | getResponse }}
                {{ if eq $resp.Response.StatusCode 200 }}
                  <div class="sol-stat-grid">
                    <div class="sol-stat-card">
                      <div class="sol-stat-value color-primary">{{ $resp.JSON.Int "pending" }}</div>
                      <div class="sol-stat-label">Pending</div>
                    </div>
                    <div class="sol-stat-card">
                      <div class="sol-stat-value">{{ $resp.JSON.Int "processing" }}</div>
                      <div class="sol-stat-label">Processing</div>
                    </div>
                    <div class="sol-stat-card">
                      <div class="sol-stat-value color-positive">{{ $resp.JSON.Int "available" }}</div>
                      <div class="sol-stat-label">Available</div>
                    </div>
                  </div>
                {{ else }}
                  <div class="sol-hint">Seerr API returned HTTP {{ $resp.Response.StatusCode }}</div>
                {{ end }}
              {{ end }}

          - type: custom-api
            title: Prowlarr Indexers & Byparr
            title-url: https://prowlarr.vrg.rocks
            cache: 5m
            options:
              api-key: ${PROWLARR_API_KEY}
            template: |
              {{ $apiKey := .Options.StringOr "api-key" "" }}
              {{ if eq $apiKey "" }}
                <div class="sol-hint">
                  Set <code>PROWLARR_API_KEY</code> in <code>.env</code> to monitor indexer health.
                </div>
              {{ else }}
                {{ $indexers := newRequest "http://prowlarr:9696/api/v1/indexer"
                    | withHeader "X-Api-Key" $apiKey
                    | getResponse }}
                {{ $health := newRequest "http://prowlarr:9696/api/v1/health"
                    | withHeader "X-Api-Key" $apiKey
                    | getResponse }}
                {{ if eq $indexers.Response.StatusCode 200 }}
                  {{ $all := $indexers.JSON.Array "" }}
                  {{ $enabled := $indexers.JSON.Array "#(enable==true)#" }}
                  {{ $issues := $health.JSON.Array "" }}
                  <div class="sol-stat-grid">
                    <div class="sol-stat-card">
                      <div class="sol-stat-value color-positive">{{ len $enabled }}</div>
                      <div class="sol-stat-label">Enabled</div>
                    </div>
                    <div class="sol-stat-card">
                      <div class="sol-stat-value">{{ len $all }}</div>
                      <div class="sol-stat-label">Total</div>
                    </div>
                    <div class="sol-stat-card">
                      <div class="sol-stat-value {{ if gt (len $issues) 0 }}color-negative{{ else }}color-positive{{ end }}">
                        {{ len $issues }}
                      </div>
                      <div class="sol-stat-label">Alerts</div>
                    </div>
                  </div>
                  {{ range $issues }}
                    <div class="margin-top-8 size-h6 color-negative">• {{ .String "message" }}</div>
                  {{ end }}
                {{ else }}
                  <div class="sol-hint">Prowlarr API returned HTTP {{ $indexers.Response.StatusCode }}</div>
                {{ end }}
              {{ end }}

          - type: custom-api
            title: Paperless-ngx OCR Vault
            title-url: https://docs.vrg.rocks
            cache: 10m
            options:
              api-key: ${PAPERLESS_API_KEY}
            template: |
              {{ $apiKey := .Options.StringOr "api-key" "" }}
              {{ if eq $apiKey "" }}
                <div class="sol-hint">
                  Set <code>PAPERLESS_API_KEY</code> in <code>.env</code> to display live document and OCR counts.
                </div>
              {{ else }}
                {{ $resp := newRequest "http://paperless-webserver:8000/api/statistics/"
                    | withHeader "Authorization" (concat "Token " $apiKey)
                    | withHeader "Accept" "application/json"
                    | getResponse }}
                {{ if eq $resp.Response.StatusCode 200 }}
                  <div class="sol-stat-grid">
                    <div class="sol-stat-card">
                      <div class="sol-stat-value color-primary">{{ $resp.JSON.Int "documents_total" | formatNumber }}</div>
                      <div class="sol-stat-label">Total Docs</div>
                    </div>
                    <div class="sol-stat-card">
                      <div class="sol-stat-value {{ if gt ($resp.JSON.Int "documents_inbox") 0 }}color-negative{{ else }}color-positive{{ end }}">
                        {{ $resp.JSON.Int "documents_inbox" | formatNumber }}
                      </div>
                      <div class="sol-stat-label">Inbox Queue</div>
                    </div>
                    <div class="sol-stat-card">
                      <div class="sol-stat-value">{{ $resp.JSON.Int "character_count" | formatApproxNumber }}</div>
                      <div class="sol-stat-label">OCR Chars</div>
                    </div>
                  </div>
                {{ else }}
                  <div class="sol-hint">Paperless API returned HTTP {{ $resp.Response.StatusCode }}</div>
                {{ end }}
              {{ end }}

      # ------------------------------------------------------------------------
      # Center Column: Radarr/Sonarr Queues & Full 20-Service Health Mesh
      # ------------------------------------------------------------------------
      - size: full
        widgets:
          - type: split-column
            widgets:
              - type: custom-api
                title: Radarr Cinema Queue & Calendar
                title-url: https://radarr.vrg.rocks
                cache: 2m
                options:
                  api-key: ${RADARR_API_KEY}
                template: |
                  {{ $apiKey := .Options.StringOr "api-key" "" }}
                  {{ if eq $apiKey "" }}
                    <div class="sol-hint">
                      Set <code>RADARR_API_KEY</code> in <code>.env</code> to view movie queue and upcoming releases.
                    </div>
                  {{ else }}
                    {{ $queue := newRequest "http://radarr:7878/api/v3/queue"
                        | withParameter "includeMovie" "true"
                        | withHeader "X-Api-Key" $apiKey
                        | getResponse }}
                    {{ $cal := newRequest "http://radarr:7878/api/v3/calendar"
                        | withParameter "start" (now | formatTime "DateOnly")
                        | withParameter "end" (offsetNow "720h" | formatTime "DateOnly")
                        | withParameter "unmonitored" "false"
                        | withHeader "X-Api-Key" $apiKey
                        | getResponse }}
                    {{ if eq $queue.Response.StatusCode 200 }}
                      <div class="flex justify-between items-center margin-bottom-10">
                        <span class="size-h6 color-subdue">Active Downloads</span>
                        <span class="sol-badge {{ if gt ($queue.JSON.Int "totalRecords") 0 }}sol-badge--info{{ else }}sol-badge--ok{{ end }}">
                          {{ $queue.JSON.Int "totalRecords" }} in queue
                        </span>
                      </div>
                      {{ range $queue.JSON.Array "records" }}
                        <div class="margin-bottom-6 size-h6">
                          <strong class="color-highlight">{{ .String "title" }}</strong>
                          <span class="color-subdue">({{ .String "status" }} • {{ .String "timeleft" }})</span>
                        </div>
                      {{ end }}
                    {{ end }}
                    {{ if eq $cal.Response.StatusCode 200 }}
                      <div class="size-h6 color-subdue margin-top-10 margin-bottom-6">Upcoming Monitored Releases (30d)</div>
                      <ul class="list list-with-separator">
                        {{ range $cal.JSON.Array "" }}
                          <li>
                            <div class="flex justify-between items-center">
                              <span class="color-highlight">{{ .String "title" }} ({{ .Int "year" }})</span>
                              <span class="size-h6 color-subdue">{{ .String "status" }}</span>
                            </div>
                          </li>
                        {{ else }}
                          <li class="size-h6 color-subdue">No monitored movies scheduled in the next 30 days.</li>
                        {{ end }}
                      </ul>
                    {{ end }}
                  {{ end }}

              - type: custom-api
                title: Sonarr Series Queue & Airings
                title-url: https://sonarr.vrg.rocks
                cache: 2m
                options:
                  api-key: ${SONARR_API_KEY}
                template: |
                  {{ $apiKey := .Options.StringOr "api-key" "" }}
                  {{ if eq $apiKey "" }}
                    <div class="sol-hint">
                      Set <code>SONARR_API_KEY</code> in <code>.env</code> to view series queue and upcoming episodes.
                    </div>
                  {{ else }}
                    {{ $queue := newRequest "http://sonarr:8989/api/v3/queue"
                        | withParameter "includeSeries" "true"
                        | withParameter "includeEpisode" "true"
                        | withHeader "X-Api-Key" $apiKey
                        | getResponse }}
                    {{ $cal := newRequest "http://sonarr:8989/api/v3/calendar"
                        | withParameter "start" (now | formatTime "DateOnly")
                        | withParameter "end" (offsetNow "168h" | formatTime "DateOnly")
                        | withParameter "unmonitored" "false"
                        | withParameter "includeSeries" "true"
                        | withHeader "X-Api-Key" $apiKey
                        | getResponse }}
                    {{ if eq $queue.Response.StatusCode 200 }}
                      <div class="flex justify-between items-center margin-bottom-10">
                        <span class="size-h6 color-subdue">Active Downloads</span>
                        <span class="sol-badge {{ if gt ($queue.JSON.Int "totalRecords") 0 }}sol-badge--info{{ else }}sol-badge--ok{{ end }}">
                          {{ $queue.JSON.Int "totalRecords" }} in queue
                        </span>
                      </div>
                      {{ range $queue.JSON.Array "records" }}
                        <div class="margin-bottom-6 size-h6">
                          <strong class="color-highlight">{{ .String "series.title" }}</strong>
                          <span class="color-subdue">S{{ printf "%02d" (.Int "episode.seasonNumber") }}E{{ printf "%02d" (.Int "episode.episodeNumber") }} • {{ .String "timeleft" }}</span>
                        </div>
                      {{ end }}
                    {{ end }}
                    {{ if eq $cal.Response.StatusCode 200 }}
                      <div class="size-h6 color-subdue margin-top-10 margin-bottom-6">Upcoming Episodes (Next 7d)</div>
                      <ul class="list list-with-separator">
                        {{ range $cal.JSON.Array "" }}
                          <li>
                            <div class="flex justify-between items-center">
                              <span class="color-highlight">{{ .String "series.title" }} — S{{ printf "%02d" (.Int "seasonNumber") }}E{{ printf "%02d" (.Int "episodeNumber") }}</span>
                              <span class="size-h6 color-subdue">{{ .String "title" }}</span>
                            </div>
                          </li>
                        {{ else }}
                          <li class="size-h6 color-subdue">No monitored episodes airing in the next 7 days.</li>
                        {{ end }}
                      </ul>
                    {{ end }}
                  {{ end }}

