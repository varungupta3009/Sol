      # ------------------------------------------------------------------------
      # Center Column: Radarr/Sonarr Split Telemetry, Cinema Essays & Subreddits
      # ------------------------------------------------------------------------
      - size: full
        widgets:
          - type: split-column
            widgets:
              - type: custom-api
                title: Radarr Cinema Queue & Calendar
                title-url: https://radarr.vrg.rocks
                cache: 2m
                options:
                  api-key: ${RADARR_API_KEY}
                template: |
                  {{ $apiKey := .Options.StringOr "api-key" "" }}
                  {{ if eq $apiKey "" }}
                    <div class="sol-hint">
                      Set <code>RADARR_API_KEY</code> in <code>.env</code> (from <code>config/radarr/config.xml</code>) to view movie queue and upcoming releases.
                    </div>
                  {{ else }}
                    {{ $queue := newRequest "http://radarr:7878/api/v3/queue"
                        | withParameter "includeMovie" "true"
                        | withHeader "X-Api-Key" $apiKey
                        | getResponse }}
                    {{ $cal := newRequest "http://radarr:7878/api/v3/calendar"
                        | withParameter "start" (now | formatTime "DateOnly")
                        | withParameter "end" (offsetNow "720h" | formatTime "DateOnly")
                        | withParameter "unmonitored" "false"
                        | withHeader "X-Api-Key" $apiKey
                        | getResponse }}
                    {{ if eq $queue.Response.StatusCode 200 }}
                      <div class="flex justify-between items-center margin-bottom-10">
                        <span class="size-h6 color-subdue">Active Downloads</span>
                        <span class="sol-badge {{ if gt ($queue.JSON.Int "totalRecords") 0 }}sol-badge--info{{ else }}sol-badge--ok{{ end }}">
                          {{ $queue.JSON.Int "totalRecords" }} in queue
                        </span>
                      </div>
                      {{ range $queue.JSON.Array "records" }}
                        <div class="margin-bottom-6 size-h6">
                          <strong class="color-highlight">{{ .String "title" }}</strong>
                          <span class="color-subdue">({{ .String "status" }} • {{ .String "timeleft" }})</span>
                        </div>
                      {{ end }}
                    {{ end }}
                    {{ if eq $cal.Response.StatusCode 200 }}
                      <div class="size-h6 color-subdue margin-top-10 margin-bottom-6">Upcoming Monitored Releases (30d)</div>
                      <ul class="list list-with-separator">
                        {{ range $cal.JSON.Array "" }}
                          <li>
                            <div class="flex justify-between items-center">
                              <span class="color-highlight">{{ .String "title" }} ({{ .Int "year" }})</span>
                              <span class="size-h6 color-subdue">{{ .String "status" }}</span>
                            </div>
                          </li>
                        {{ else }}
                          <li class="size-h6 color-subdue">No monitored movies scheduled in the next 30 days.</li>
                        {{ end }}
                      </ul>
                    {{ end }}
                  {{ end }}

              - type: custom-api
                title: Sonarr Series Queue & Airings
                title-url: https://sonarr.vrg.rocks
                cache: 2m
                options:
                  api-key: ${SONARR_API_KEY}
                template: |
                  {{ $apiKey := .Options.StringOr "api-key" "" }}
                  {{ if eq $apiKey "" }}
                    <div class="sol-hint">
                      Set <code>SONARR_API_KEY</code> in <code>.env</code> (from <code>config/sonarr/config.xml</code>) to view series queue and upcoming episodes.
                    </div>
                  {{ else }}
                    {{ $queue := newRequest "http://sonarr:8989/api/v3/queue"
                        | withParameter "includeSeries" "true"
                        | withParameter "includeEpisode" "true"
                        | withHeader "X-Api-Key" $apiKey
                        | getResponse }}
                    {{ $cal := newRequest "http://sonarr:8989/api/v3/calendar"
                        | withParameter "start" (now | formatTime "DateOnly")
                        | withParameter "end" (offsetNow "168h" | formatTime "DateOnly")
                        | withParameter "unmonitored" "false"
                        | withParameter "includeSeries" "true"
                        | withHeader "X-Api-Key" $apiKey
                        | getResponse }}
                    {{ if eq $queue.Response.StatusCode 200 }}
                      <div class="flex justify-between items-center margin-bottom-10">
                        <span class="size-h6 color-subdue">Active Downloads</span>
                        <span class="sol-badge {{ if gt ($queue.JSON.Int "totalRecords") 0 }}sol-badge--info{{ else }}sol-badge--ok{{ end }}">
                          {{ $queue.JSON.Int "totalRecords" }} in queue
                        </span>
                      </div>
                      {{ range $queue.JSON.Array "records" }}
                        <div class="margin-bottom-6 size-h6">
                          <strong class="color-highlight">{{ .String "series.title" }}</strong>
                          <span class="color-subdue">S{{ printf "%02d" (.Int "episode.seasonNumber") }}E{{ printf "%02d" (.Int "episode.episodeNumber") }} • {{ .String "timeleft" }}</span>
                        </div>
                      {{ end }}
                    {{ end }}
                    {{ if eq $cal.Response.StatusCode 200 }}
                      <div class="size-h6 color-subdue margin-top-10 margin-bottom-6">Upcoming Episodes (Next 7d)</div>
                      <ul class="list list-with-separator">
                        {{ range $cal.JSON.Array "" }}
                          <li>
                            <div class="flex justify-between items-center">
                              <span class="color-highlight">{{ .String "series.title" }} — S{{ printf "%02d" (.Int "seasonNumber") }}E{{ printf "%02d" (.Int "episodeNumber") }}</span>
                              <span class="size-h6 color-subdue">{{ .String "title" }}</span>
                            </div>
                          </li>
                        {{ else }}
                          <li class="size-h6 color-subdue">No monitored episodes airing in the next 7 days.</li>
                        {{ end }}
                      </ul>
                    {{ end }}
                  {{ end }}

