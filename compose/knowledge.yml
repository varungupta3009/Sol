# ================================================================
# Sol Infrastructure - Knowledge Management & Digital Notes
# ================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----------------------------------------------------------------
  # Ignis: Obsidian Vault Synchronization & Note Manager
  # ----------------------------------------------------------------
  ignis:
    container_name: ignis
    image: nobbe/ignis:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ${DOCKER_DATA_DIR}/ignis/vaults:/vaults
      - ${DOCKER_DATA_DIR}/ignis/data:/app/data
      - ${DOCKER_DATA_DIR}/ignis/obsidian:/app/obsidian-app
    labels:
      glance.id: ignis
      glance.name: Ignis
      glance.icon: sh:obsidian
      glance.url: https://ignis.vrg.rocks
      glance.description: Obsidian Vault Synchronization

  # ----------------------------------------------------------------
  # Readeck: Read-Later, Article Archiver & Bookmark Manager (Go + SQLite)
  # ----------------------------------------------------------------
  readeck:
    container_name: readeck
    image: codeberg.org/readeck/readeck:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      READECK_LOG_LEVEL: info
      READECK_SERVER_HOST: "0.0.0.0"
      READECK_SERVER_PORT: "8000"
      READECK_ALLOWED_HOSTS: "links.vrg.rocks"
      READECK_USE_X_FORWARDED: "true"
    volumes:
      - ${DOCKER_DATA_DIR}/readeck:/readeck
    healthcheck:
      test: ["CMD", "/bin/readeck", "healthcheck", "-config", "config.toml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      glance.id: readeck
      glance.name: Readeck
      glance.icon: sh:readeck
      glance.url: https://links.vrg.rocks
      glance.description: Read-Later & Article Archiver

  # ----------------------------------------------------------------
  # Standby Knowledge & E-Book Services (Launch via: docker compose --profile standby up -d <service>)
  # ----------------------------------------------------------------
  leafwiki:
    container_name: leafwiki
    image: ghcr.io/perber/leafwiki:latest
    profiles: ["standby"]
    restart: unless-stopped
    logging: *default-logging
    user: "${PUID}:${PGID}"
    environment:
      LEAFWIKI_JWT_SECRET: ${CORE_PASSWORD:-}
      LEAFWIKI_ADMIN_PASSWORD: ${CORE_PASSWORD:-}
      LEAFWIKI_ALLOW_INSECURE: "true"
    volumes:
      - ${DOCKER_DATA_DIR}/leafwiki:/app/data
    labels:
      glance.id: leafwiki
      glance.name: LeafWiki
      glance.icon: sh:leafwiki
      glance.url: https://leaf.vrg.rocks
      glance.description: Markdown Digital Garden

  kavita:
    container_name: kavita
    image: lscr.io/linuxserver/kavita:latest
    profiles: ["standby"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${DOCKER_CONFIG_DIR}/kavita:/config
      - ${DOCKER_DATA_DIR}:/data
    labels:
      glance.id: kavita
      glance.name: Kavita
      glance.icon: sh:kavita
      glance.url: https://kavita.vrg.rocks
      glance.description: Digital Book & Manga Reader
