# ================================================================
# Sol Infrastructure - Monitoring & Dashboard Services
# ================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----------------------------------------------------------------
  # Glance: Fast, Lightweight Server Homepage & Container Dashboard
  # ----------------------------------------------------------------
  glance:
    container_name: glance
    image: glanceapp/glance:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      JELLYFIN_METAL_API_KEY: ${JELLYFIN_METAL_API_KEY:-}
      SEERR_API_KEY: ${SEERR_API_KEY:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      PAPERLESS_API_KEY: ${PAPERLESS_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ${DOCKER_CONFIG_DIR}/glance/config:/app/config
      - ${DOCKER_CONFIG_DIR}/glance/assets:/app/assets
      - ${EXTERNAL_DRIVE_00}:/media/panopticon:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
    labels:
      glance.id: glance
      glance.name: Glance
      glance.icon: sh:glance
      glance.url: https://dash.vrg.rocks
      glance.description: Sol Server Homepage

  # ----------------------------------------------------------------
  # Standby Monitoring Services (Launch via: docker compose --profile standby up -d <service>)
  # ----------------------------------------------------------------
  gatus:
    container_name: gatus
    image: twinproduction/gatus:latest
    profiles: ["standby"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ${DOCKER_CONFIG_DIR}/gatus:/config
    expose:
      - "8080"
    labels:
      glance.id: gatus
      glance.name: Gatus
      glance.icon: sh:gatus
      glance.url: https://status.vrg.rocks
      glance.description: Service Health & Status Page

  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    profiles: ["standby"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      DOZZLE_ENABLE_ACTIONS: "true"
      DOZZLE_ENABLE_SHELL: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      glance.id: dozzle
      glance.name: Dozzle
      glance.icon: sh:dozzle
      glance.url: https://dozzle.vrg.rocks
      glance.description: Real-time Container Logs

  beszel:
    container_name: beszel
    image: henrygd/beszel:latest
    profiles: ["standby"]
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ${DOCKER_DATA_DIR}/beszel:/beszel_data
    expose:
      - "8090"
    labels:
      glance.id: beszel
      glance.name: Beszel
      glance.icon: sh:beszel
      glance.url: https://beszel.vrg.rocks
      glance.description: Server Resource Metrics

  beszel-agent:
    container_name: beszel-agent
    image: henrygd/beszel-agent:latest
    profiles: ["standby"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      LISTEN: 45876
      KEY: ${BESZEL_AGENT_KEY:-}
      TOKEN: ${BESZEL_AGENT_TOKEN:-}
      HUB_URL: http://beszel:8090
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DOCKER_DATA_DIR}/beszel_agent:/var/lib/beszel-agent
    labels:
      glance.name: Agent
      glance.parent: beszel
