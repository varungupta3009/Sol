# ================================================================
# Sol Infrastructure - Developer Workspaces & Cloud IDEs
# ================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----------------------------------------------------------------
  # Code-Server: Browser-Based VSCode IDE on Sol Filesystem
  # ----------------------------------------------------------------
  code-server:
    container_name: code-server
    image: lscr.io/linuxserver/code-server:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      AUTH: password
      HASHED_PASSWORD: ${CODE_SERVER_HASHED_PASSWORD}
      PROXY_DOMAIN: code.vrg.rocks
      PWA_APPNAME: VRGCode
    volumes:
      - ${DOCKER_CONFIG_DIR}/code-server:/config
      - ${DOCKER_BASE_DIR}:/Server
      - /Users/vrg/Documents:/Documents
    labels:
      glance.id: code-server
      glance.name: Code Server
      glance.icon: sh:visual-studio-code
      glance.url: https://code.vrg.rocks
      glance.description: Browser VS Code IDE

  # ----------------------------------------------------------------
  # Coder: Cloud Development Environment (CDE) Platform
  # ----------------------------------------------------------------
  coder:
    container_name: coder
    image: ghcr.io/coder/coder:${CODER_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    group_add:
      - "${PGID}"
    environment:
      CODER_ACCESS_URL: ${CODER_ACCESS_URL:-https://coder.vrg.rocks}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_DIR}/coder:/home/coder/.config
      - ${DOCKER_BASE_DIR}:/Sol
    labels:
      glance.id: coder
      glance.name: Coder
      glance.icon: sh:visual-studio-code
      glance.url: https://coder.vrg.rocks
      glance.description: Cloud Development Environments

  # ----------------------------------------------------------------
  # PocketBase: Single-Binary Go + SQLite Realtime Backend Sandbox
  # ----------------------------------------------------------------
  pocketbase:
    container_name: pocketbase
    image: ghcr.io/muchobien/pocketbase:latest
    restart: unless-stopped
    logging: *default-logging
    user: "${PUID}:${PGID}"
    environment:
      PB_HOST: "0.0.0.0"
      PB_PORT: "8090"
      PB_ADMIN_EMAIL: ${ACME_EMAIL:-admin@example.com}
      PB_ADMIN_PASSWORD: ${CORE_PASSWORD}
    volumes:
      - ${DOCKER_DATA_DIR}/pocketbase:/pb_data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8090/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      glance.id: pocketbase
      glance.name: PocketBase
      glance.icon: sh:pocketbase
      glance.url: https://pb.vrg.rocks
      glance.description: Go + SQLite Backend Sandbox
