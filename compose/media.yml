# ================================================================
# Sol Infrastructure - Media Streaming & *arr PVR Automation
# ================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----------------------------------------------------------------
  # Jellyfin: Hardware-Accelerated Media Streaming Server
  # ----------------------------------------------------------------
  jellyfin:
    container_name: jellyfin
    image: lscr.io/linuxserver/jellyfin:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${DOCKER_CONFIG_DIR}/jellyfin:/config
      - ${DOCKER_DATA_DIR}/media:/media/internal
      - ${EXTERNAL_DRIVE_00}:/media/external
      # - ${EXTERNAL_DRIVE_01}:/media/ext01
      # - ${EXTERNAL_DRIVE_02}:/media/ext02
    tmpfs:
      - /tmp/jellyfin:size=2g,uid=501,gid=20,mode=0755 # Keeps Trickplay & transcode frame buffers in RAM off the APFS SSD
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8096/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      glance.id: jellyfin
      glance.name: Jellyfin
      glance.icon: sh:jellyfin
      glance.url: https://watch.vrg.rocks
      glance.description: Media Streaming Server

  # ----------------------------------------------------------------
  # Seerr: Media Discovery & Automated Request Manager
  # ----------------------------------------------------------------
  seerr:
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    volumes:
      - ${DOCKER_CONFIG_DIR}/seerr:/app/config
    dns:
      - 8.8.8.8 # Prevents ISP blocking TMDb API lookups
      - 1.1.1.1
    networks:
      default:
        aliases:
          - jellyseerr
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    labels:
      glance.id: seerr
      glance.name: Seerr
      glance.icon: sh:seerr
      glance.url: https://request.vrg.rocks
      glance.description: Media Requests & Discovery

  # ----------------------------------------------------------------
  # Radarr: Movie Collection Manager & Downloader Coordinator
  # ----------------------------------------------------------------
  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      RADARR__SERVER__ALLOWEDHOSTS: "radarr.vrg.rocks,radarr,localhost,127.0.0.1"
    volumes:
      - ${DOCKER_CONFIG_DIR}/radarr:/config
      - ${DOCKER_DATA_DIR}:/data # Unified root mount for zero-copy APFS atomic hardlinks
      - ${EXTERNAL_DRIVE_00}:/external
      # - ${EXTERNAL_DRIVE_01}:/ext01
    dns:
      - 1.1.1.1 # Fast Cloudflare DNS (prevents ISP tracker scraping blocks)
      - 9.9.9.9 # Quad9 secure fallback DNS
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7878/ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      glance.id: radarr
      glance.name: Radarr
      glance.icon: sh:radarr
      glance.url: https://radarr.vrg.rocks
      glance.description: Movie Collection Manager

  # ----------------------------------------------------------------
  # Sonarr: Television Series Tracker & Automated Downloader
  # ----------------------------------------------------------------
  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      SONARR__SERVER__ALLOWEDHOSTS: "sonarr.vrg.rocks,sonarr,localhost,127.0.0.1"
    volumes:
      - ${DOCKER_CONFIG_DIR}/sonarr:/config
      - ${DOCKER_DATA_DIR}:/data # Unified root mount for zero-copy APFS atomic hardlinks
      - ${EXTERNAL_DRIVE_00}:/external
      # - ${EXTERNAL_DRIVE_01}:/ext01
    dns:
      - 1.1.1.1
      - 9.9.9.9
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8989/ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      glance.id: sonarr
      glance.name: Sonarr
      glance.icon: sh:sonarr
      glance.url: https://sonarr.vrg.rocks
      glance.description: TV Series Tracker & Downloader

  # ----------------------------------------------------------------
  # Bazarr: Subtitle Search & Synchronization Companion
  # ----------------------------------------------------------------
  bazarr:
    container_name: bazarr
    image: lscr.io/linuxserver/bazarr:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${DOCKER_CONFIG_DIR}/bazarr:/config
      - ${DOCKER_DATA_DIR}:/data
      - ${EXTERNAL_DRIVE_00}:/external
      # - ${EXTERNAL_DRIVE_01}:/ext01
    dns:
      - 1.1.1.1
      - 9.9.9.9
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6767/ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      glance.id: bazarr
      glance.name: Bazarr
      glance.icon: sh:bazarr
      glance.url: https://bazarr.vrg.rocks
      glance.description: Subtitle Search & Sync

  # ----------------------------------------------------------------
  # Lidarr: Music Discography Manager & Track Downloader
  # ----------------------------------------------------------------
  lidarr:
    container_name: lidarr
    image: lscr.io/linuxserver/lidarr:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      LIDARR__SERVER__ALLOWEDHOSTS: "lidarr.vrg.rocks,lidarr,localhost,127.0.0.1"
    volumes:
      - ${DOCKER_CONFIG_DIR}/lidarr:/config
      - ${DOCKER_DATA_DIR}:/data
      - ${EXTERNAL_DRIVE_00}:/external
      # - ${EXTERNAL_DRIVE_01}:/ext01
    dns:
      - 1.1.1.1
      - 9.9.9.9
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8686/ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      glance.id: lidarr
      glance.name: Lidarr
      glance.icon: sh:lidarr
      glance.url: https://lidarr.vrg.rocks
      glance.description: Music Discography Manager

  # ----------------------------------------------------------------
  # Prowlarr: Centralized Torrent & Usenet Indexer Proxy
  # ----------------------------------------------------------------
  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      PROWLARR__SERVER__ALLOWEDHOSTS: "prowlarr.vrg.rocks,prowlarr,localhost,127.0.0.1"
    volumes:
      - ${DOCKER_CONFIG_DIR}/prowlarr:/config
    dns:
      - 1.1.1.1 # Essential for bypassing ISP-level torrent site blocks & timeouts
      - 9.9.9.9
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9696/ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      glance.id: prowlarr
      glance.name: Prowlarr
      glance.icon: sh:prowlarr
      glance.url: https://prowlarr.vrg.rocks
      glance.description: Torrent & Usenet Indexer Proxy

  # ----------------------------------------------------------------
  # Byparr: Modern Cloudflare Turnstile Bypass Service for Prowlarr
  # (Drop-in replacement for FlareSolverr on port 8191; aliases flaresolverr
  # so existing Prowlarr indexer proxy settings work with zero changes)
  # ----------------------------------------------------------------
  byparr:
    container_name: byparr
    image: ghcr.io/thephaseless/byparr:latest
    restart: unless-stopped
    logging: *default-logging
    shm_size: 1gb
    tmpfs:
      - /tmp:size=512m,exec,mode=1777
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
      BLOCK_MEDIA: "true"
    dns:
      - 1.1.1.1
      - 9.9.9.9
    networks:
      default:
        aliases:
          - flaresolverr
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8191/openapi.json >/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      start_period: 15s
      retries: 3
    labels:
      glance.id: byparr
      glance.name: Byparr
      glance.icon: sh:flaresolverr
      glance.url: https://byparr.vrg.rocks
      glance.description: Cloudflare Turnstile Solver

  # ----------------------------------------------------------------
  # Standby Media & Automation Helpers (Launch via: docker compose --profile standby up -d <service>)
  # ----------------------------------------------------------------
  recyclarr:
    container_name: recyclarr
    image: ghcr.io/recyclarr/recyclarr:latest
    profiles: ["standby"]
    restart: unless-stopped
    logging: *default-logging
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      CRON_SCHEDULE: "@daily"
    volumes:
      - ${DOCKER_CONFIG_DIR}/recyclarr:/config
    labels:
      glance.id: recyclarr
      glance.name: Recyclarr
      glance.icon: sh:recyclarr
      glance.url: https://radarr.vrg.rocks
      glance.description: TRaSH Guides Sync Engine

  wizarr:
    container_name: wizarr
    image: ghcr.io/wizarrrr/wizarr:latest
    profiles: ["standby"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      DISABLE_BUILTIN_AUTH: "false"
    volumes:
      - ${DOCKER_CONFIG_DIR}/wizarr:/data
    labels:
      glance.id: wizarr
      glance.name: Wizarr
      glance.icon: sh:wizarr
      glance.url: https://wizarr.vrg.rocks
      glance.description: Jellyfin User Invitation Portal
