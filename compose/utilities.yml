# ================================================================
# Sol Infrastructure - Storage Logistics, Inventory & Utilities
# ================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----------------------------------------------------------------
  # Copyparty: High-Speed Multi-Port File Server & WebDAV
  # ----------------------------------------------------------------
  copyparty:
    container_name: copyparty
    image: copyparty/ac:latest
    restart: unless-stopped
    logging: *default-logging
    user: "${PUID}:${PGID}"
    environment:
      LD_PRELOAD: /usr/lib/libmimalloc-secure.so.NOPE
      PYTHONUNBUFFERED: 1
    volumes:
      - ${DOCKER_CONFIG_DIR}/copyparty:/cfg
      - ${DOCKER_DATA_DIR}/copyparty:/w/copyparty
      - ${DOCKER_DATA_DIR}/media:/w/media
      - ${DOCKER_DATA_DIR}/torrents:/w/torrents
      - ${EXTERNAL_DRIVE_00}:/w/external
      # - ${EXTERNAL_DRIVE_01}:/w/ext01
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q 127.0.0.1:3923/?reset=/._"]
      interval: 1m
      timeout: 2s
      retries: 5
      start_period: 15s
    labels:
      glance.id: copyparty
      glance.name: Copyparty
      glance.icon: sh:copyparty
      glance.url: https://files.vrg.rocks
      glance.description: File Server & WebDAV

  # ----------------------------------------------------------------
  # ntfy: HTTP-Based Pub/Sub Push Notification Service
  # ----------------------------------------------------------------
  ntfy:
    container_name: ntfy
    image: binwiederhier/ntfy:latest
    command:
      - serve
    restart: unless-stopped
    logging: *default-logging
    init: true
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
    volumes:
      - ${DOCKER_DATA_DIR}/ntfy/var/cache/ntfy:/var/cache/ntfy
      - ${DOCKER_CONFIG_DIR}/ntfy/etc/ntfy:/etc/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      glance.id: ntfy
      glance.name: ntfy
      glance.icon: sh:ntfy
      glance.url: https://ntfy.vrg.rocks
      glance.description: Push Notification Service

  # ----------------------------------------------------------------
  # Homebox: Physical Asset & Home Inventory Management (Native OIDC)
  # ----------------------------------------------------------------
  homebox:
    container_name: homebox
    image: ghcr.io/sysadminsmedia/homebox:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      HBOX_LOG_LEVEL: info
      HBOX_LOG_FORMAT: text
      HBOX_WEB_MAX_FILE_UPLOAD: 10
      HBOX_OPTIONS_ALLOW_ANALYTICS: "false"
      HBOX_AUTH_API_KEY_PEPPER: ${HBOX_AUTH_API_KEY_PEPPER}
      HBOX_OPTIONS_HOSTNAME: inv.vrg.rocks
      HBOX_OPTIONS_TRUST_PROXY: "true"
      HBOX_OPTIONS_ALLOW_LOCAL_LOGIN: "false"
      HBOX_OPTIONS_ALLOW_REGISTRATION: "false"
      HBOX_OIDC_ENABLED: "true"
      HBOX_OIDC_AUTO_REDIRECT: "true"
      HBOX_OIDC_ISSUER_URL: ${TINYAUTH_APPURL:-https://auth.vrg.rocks}
      HBOX_OIDC_CLIENT_ID: ${TINYAUTH_OIDC_HOMEBOX_CLIENT_ID}
      HBOX_OIDC_CLIENT_SECRET: ${TINYAUTH_OIDC_HOMEBOX_CLIENT_SECRET}
      HBOX_OIDC_SCOPE: "openid profile email"
      HBOX_OIDC_BUTTON_TEXT: "Continue with Google SSO"
    volumes:
      - ${DOCKER_DATA_DIR}/homebox:/data/
    labels:
      glance.id: homebox
      glance.name: Homebox
      glance.icon: sh:homebox
      glance.url: https://inv.vrg.rocks
      glance.description: Home Inventory Management

  # ----------------------------------------------------------------
  # Backrest: Encrypted Restic Backup Engine, Scheduler & WebUI
  # ----------------------------------------------------------------
  backrest:
    container_name: backrest
    image: ghcr.io/garethgeorge/backrest:latest
    restart: unless-stopped
    logging: *default-logging
    hostname: sol-backrest
    environment:
      BACKREST_DATA: /data
      BACKREST_CONFIG: /config/config.json
      XDG_CACHE_HOME: /cache
      RCLONE_CONFIG: /rclone/rclone.conf
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-${CORE_PASSWORD}}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ${DOCKER_CONFIG_DIR}/backrest:/config
      - ${DOCKER_DATA_DIR}/backrest/data:/data
      - ${DOCKER_DATA_DIR}/backrest/cache:/cache
      - ${DOCKER_CONFIG_DIR}/rclone:/rclone:ro
      - ${DOCKER_BASE_DIR}:/userdata/sol
      - ${EXTERNAL_DRIVE_00}/backups/sol-restic:/repos/local-panopticon
    labels:
      glance.id: backrest
      glance.name: Backrest
      glance.icon: sh:restic
      glance.url: https://backrest.vrg.rocks
      glance.description: Encrypted Restic Backup Engine

  # ----------------------------------------------------------------
  # Enclosed: Zero-Knowledge Client-Side Encrypted Notes & File Drops (Hono)
  # ----------------------------------------------------------------
  enclosed:
    container_name: enclosed
    image: ghcr.io/corentinth/enclosed:latest
    restart: unless-stopped
    logging: *default-logging
    user: "${PUID}:${PGID}"
    environment:
      PUBLIC_IS_AUTHENTICATION_REQUIRED: "false"
      STORAGE_DRIVER_FS_LITE_PATH: /app/.data
    volumes:
      - ${DOCKER_DATA_DIR}/enclosed:/app/.data
    labels:
      glance.id: enclosed
      glance.name: Enclosed
      glance.icon: sh:enclosed
      glance.url: https://send.vrg.rocks
      glance.description: Zero-Knowledge Encrypted Notes & Drops

  # ----------------------------------------------------------------
  # AirTrail: Personal Flight Log, Airbus Telemetry & Passport Map (SvelteKit)
  # Shares paperless-db (PostgreSQL 17 Alpine) via dedicated 'airtrail' DB
  # ----------------------------------------------------------------
  airtrail:
    container_name: airtrail
    image: johly/airtrail:latest
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      paperless-db:
        condition: service_healthy
    environment:
      ORIGIN: https://fly.vrg.rocks
      ADDRESS_HEADER: X-Forwarded-For
      DB_URL: postgres://${PAPERLESS_DB_USER:-paperless}:${PAPERLESS_DB_PASS:-paperless}@paperless-db:5432/airtrail
      UPLOAD_LOCATION: /app/uploads
      BODY_SIZE_LIMIT: 20M
      PUID: ${PUID:-501}
      PGID: ${PGID:-20}
      OAUTH_ENABLED: "true"
      OAUTH_ISSUER_URL: ${TINYAUTH_APPURL:-https://auth.vrg.rocks}
      OAUTH_CLIENT_ID: ${TINYAUTH_OIDC_AIRTRAIL_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${TINYAUTH_OIDC_AIRTRAIL_CLIENT_SECRET}
      OAUTH_SCOPE: "openid profile email"
      OAUTH_TOKEN_ENDPOINT_AUTH_METHOD: "client_secret_post"
      OAUTH_AUTO_REGISTER: "true"
      OAUTH_AUTO_LOGIN: "true"
      OAUTH_HIDE_PASSWORD_FORM: "true"
      OAUTH_BUTTON_TEXT: "Continue with Google SSO"
    volumes:
      - ${DOCKER_DATA_DIR}/airtrail:/app/uploads
    labels:
      glance.id: airtrail
      glance.name: AirTrail
      glance.icon: sh:airtrail
      glance.url: https://fly.vrg.rocks
      glance.description: Personal Flight Log & Aircraft Registry

  # ----------------------------------------------------------------
  # Standby Utilities & Automation (Launch via: docker compose --profile standby up -d <service>)
  # ----------------------------------------------------------------

  vaultwarden:
    container_name: vaultwarden
    image: vaultwarden/server:latest
    profiles: ["standby"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      DOMAIN: https://vault.vrg.rocks
    volumes:
      - ${DOCKER_CONFIG_DIR}/vaultwarden:/data/
    labels:
      glance.id: vaultwarden
      glance.name: Vaultwarden
      glance.icon: auto-invert sh:vaultwarden
      glance.url: https://vault.vrg.rocks
      glance.description: Bitwarden-Compatible Password Manager

  n8n:
    container_name: n8n
    image: docker.n8n.io/n8nio/n8n
    profiles: ["standby"]
    restart: unless-stopped
    logging: *default-logging
    user: "${PUID}:${PGID}"
    environment:
      N8N_HOST: ${N8N_SUBDOMAIN:-n8n}.${N8N_DOMAIN_NAME:-vrg.rocks}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_RUNNERS_ENABLED: "true"
      NODE_ENV: production
      WEBHOOK_URL: https://${N8N_SUBDOMAIN:-n8n}.${N8N_DOMAIN_NAME:-vrg.rocks}/
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
    volumes:
      - ${DOCKER_CONFIG_DIR}/n8n:/home/node/.n8n
      - ${DOCKER_DATA_DIR}/n8n:/files
    labels:
      glance.id: n8n
      glance.name: n8n
      glance.icon: sh:n8n
      glance.url: https://n8n.vrg.rocks
      glance.description: Workflow Automation Platform

  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    profiles: ["standby"]
    restart: unless-stopped
    logging: *default-logging
    privileged: true
    network_mode: host
    volumes:
      - ${DOCKER_CONFIG_DIR}/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    labels:
      glance.id: homeassistant
      glance.name: Home Assistant
      glance.icon: sh:home-assistant
      glance.url: https://home.vrg.rocks
      glance.description: Smart Home Automation Hub

  rclone:
    container_name: rclone
    image: rclone/rclone:latest
    profiles: ["ops", "standby"]
    restart: "no"
    logging: *default-logging
    user: "${PUID}:${PGID}"
    volumes:
      - ${DOCKER_CONFIG_DIR}/rclone:/config/rclone
      - ${DOCKER_BASE_DIR}:/source:ro
      - ${DOCKER_LOGS_DIR}:/logs
    ports:
      - "127.0.0.1:53682:53682"
    labels:
      glance.name: Rclone CLI
      glance.parent: backrest
