# ================================================================
# Sol Infrastructure - Download & Cross-Seeding Pipeline
# ================================================================

services:
  # ----------------------------------------------------------------
  # qBittorrent: Primary BitTorrent Client with Web UI & WAN Port
  # ----------------------------------------------------------------
  qbittorrent:
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: ${QBITTORRENT_WEBUI_PORT:-8080}
      TORRENTING_PORT: ${QBITTORRENT_TORRENTING_PORT:-42069}
    volumes:
      - ${DOCKER_CONFIG_DIR}/qbittorrent:/config
      - ${DOCKER_DATA_DIR}:/data
      - ${EXTERNAL_DRIVE_00}:/external
      # - ${EXTERNAL_DRIVE_01}:/ext01
    ports:
      # Port Forwarding: 42069 TCP/UDP exposed to WAN for high-speed incoming peer connections
      - "${QBITTORRENT_TORRENTING_PORT:-42069}:${QBITTORRENT_TORRENTING_PORT:-42069}"
      - "${QBITTORRENT_TORRENTING_PORT:-42069}:${QBITTORRENT_TORRENTING_PORT:-42069}/udp"
    dns:
      - 1.1.1.1 # Cloudflare DNS for fast tracker announces
      - 9.9.9.9
    labels:
      glance.id: qbittorrent
      glance.name: qBittorrent
      glance.icon: sh:qbittorrent
      glance.url: https://qb.vrg.rocks
      glance.description: BitTorrent Client

  # ----------------------------------------------------------------
  # QUI: Ultra-Lean Go Web Interface for qBittorrent & Cross-Seed
  # ----------------------------------------------------------------
  qui:
    container_name: qui
    image: ghcr.io/autobrr/qui:latest
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    depends_on:
      - qbittorrent
    environment:
      TZ: ${TZ}
      QUI__HOST: 0.0.0.0
      QUI__PORT: 7476
      QUI__LOG_LEVEL: INFO
    volumes:
      - ${DOCKER_CONFIG_DIR}/qui:/config
      - ${DOCKER_DATA_DIR}:/data
      - ${EXTERNAL_DRIVE_00}:/external
    labels:
      glance.id: qui
      glance.name: QUI
      glance.icon: sh:qbittorrent
      glance.url: https://qui.vrg.rocks
      glance.parent: qbittorrent
      glance.description: Modern Go Web UI for qBittorrent

  # ----------------------------------------------------------------
  # Cross-Seed: Automated Multi-Tracker Cross-Seeding Daemon
  # ----------------------------------------------------------------
  cross-seed:
    container_name: cross-seed
    image: ghcr.io/cross-seed/cross-seed:6
    command: daemon # Runs in persistent daemon mode with periodic searching
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    volumes:
      - ${DOCKER_CONFIG_DIR}/cross-seed:/config
      - ${DOCKER_DATA_DIR}:/data # Exposes /data/torrents and /data/media for library-wide dataDirs scanning
      - ${EXTERNAL_DRIVE_00}:/external
      # - ${EXTERNAL_DRIVE_01}:/ext01
    dns:
      - 1.1.1.1
      - 9.9.9.9
    labels:
      glance.id: cross-seed
      glance.name: Cross-Seed
      glance.icon: sh:cross-seed
      glance.url: https://cs.vrg.rocks
      glance.description: Automated Cross-Seeding Daemon

  # ----------------------------------------------------------------
  # Standby Download Helpers (Launch via: docker compose --profile standby up -d <service>)
  # ----------------------------------------------------------------
  unpackerr:
    container_name: unpackerr
    image: golift/unpackerr:latest
    profiles: ["standby"]
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      UN_SONARR_0_URL: http://sonarr:8989
      UN_SONARR_0_API_KEY: ${SONARR_API_KEY:-}
      UN_RADARR_0_URL: http://radarr:7878
      UN_RADARR_0_API_KEY: ${RADARR_API_KEY:-}
      UN_LIDARR_0_URL: http://lidarr:8686
      UN_LIDARR_0_API_KEY: ${LIDARR_API_KEY:-}
      UN_FOLDER_0_PATH: /data/torrents
    volumes:
      - ${DOCKER_CONFIG_DIR}/unpackerr:/config
      - ${DOCKER_DATA_DIR}:/data
      - ${EXTERNAL_DRIVE_00}:/external
      # - ${EXTERNAL_DRIVE_01}:/ext01
    labels:
      glance.id: unpackerr
      glance.name: Unpackerr
      glance.icon: sh:unpackerr
      glance.parent: qbittorrent
      glance.description: Automated Archive Extractor for Servarr

  qbit_manage:
    container_name: qbit_manage
    image: ghcr.io/stuffanthings/qbit_manage:latest
    profiles: ["standby"]
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      QBT_WEB_SERVER: "true"
      QBT_PORT: 8181
      QBT_RUN: "false"
      QBT_SCHEDULE: 1440
      QBT_CONFIG_DIR: /config
      QBT_LOGFILE: qbit_manage.log
      QBT_RECHECK: "false"
      QBT_CAT_UPDATE: "false"
      QBT_TAG_UPDATE: "false"
      QBT_REM_UNREGISTERED: "false"
      QBT_REM_ORPHANED: "false"
      QBT_TAG_TRACKER_ERROR: "false"
      QBT_TAG_NOHARDLINKS: "false"
      QBT_SHARE_LIMITS: "false"
      QBT_SKIP_CLEANUP: "false"
      QBT_DRY_RUN: "false"
      QBT_STARTUP_DELAY: 0
      QBT_SKIP_QB_VERSION_CHECK: "false"
      QBT_DEBUG: "false"
      QBT_TRACE: "false"
      QBT_LOG_LEVEL: INFO
      QBT_LOG_SIZE: 10
      QBT_LOG_COUNT: 5
      QBT_DIVIDER: "="
      QBT_WIDTH: 100
    volumes:
      - ${DOCKER_CONFIG_DIR}/qbit_manage:/config:rw
      - ${DOCKER_CONFIG_DIR}/qbittorrent:/qbittorrent:ro
      - ${DOCKER_DATA_DIR}:/data:rw
      - ${EXTERNAL_DRIVE_00}:/external:rw
      - ${EXTERNAL_DRIVE_01}:/ext01:rw
    labels:
      glance.id: qbit_manage
      glance.name: qBit Manage
      glance.icon: sh:qbittorrent
      glance.url: https://qbm.vrg.rocks
      glance.description: Torrent Tag & Category Automation

  flood:
    container_name: flood
    image: jesec/flood:latest
    profiles: ["standby"]
    command:
      - --auth=none
      - --qburl=http://qbittorrent:${QBITTORRENT_WEBUI_PORT:-8080}
      - --qbuser=${FLOOD_QBITTORRENT_USERNAME:-VRG}
      - --qbpass=${CORE_PASSWORD:-}
      - --rundir=/config
    restart: always
    user: "${PUID}:${PGID}"
    depends_on:
      - qbittorrent
    volumes:
      - ${DOCKER_CONFIG_DIR}/flood:/config
      - ${DOCKER_DATA_DIR}/torrents:/data:ro
      - /etc/localtime:/etc/localtime:ro
    labels:
      glance.id: flood
      glance.name: Flood
      glance.icon: sh:flood
      glance.url: https://flood.vrg.rocks
      glance.description: Lightweight Torrent Web Interface
